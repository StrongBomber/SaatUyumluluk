name: Wear APK varyantlari uret

# Kaynak APK'dan Wear OS (Galaxy Watch 8, 32-bit) icin iki varyant uretir:
#   A) wear-v7a      : yalnizca armeabi-v7a kutuphaneleri (arm64-v8a cikarilir) + yeniden imza
#   B) wear-ready    : A + manifest/theme duzeltmeleri
#                      - android:windowSwipeToDismiss=false (saga kaydirinca uygulama kapanmasin)
#                      - android:largeHeap=true
#                      - uses-feature android.hardware.type.watch (required=false)
# Cikti: wear-v3.70.3 release'ine asset olarak yuklenir + reports/wear-build.md

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Kaynak release etiketi"
        required: false
        default: "apk-v3.70.3"
      source_url:
        description: "Alternatif: dogrudan APK URL'si (dolu ise release indirmesi atlanir)"
        required: false
        default: ""
  push:
    paths:
      - ".github/build-wear-trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SRC_TAG: ${{ inputs.tag || 'apk-v3.70.3' }}
      SOURCE_URL: ${{ inputs.source_url }}
      OUT_TAG: wear-v3.70.3
      KS_PASS: wearapk2026

    steps:
      - uses: actions/checkout@v4

      - name: Kaynak APK'yi indir
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          if [ -n "${SOURCE_URL:-}" ]; then
            echo "Kaynak URL: $SOURCE_URL"
            curl -fL --retry 3 -o app-src.apk "$SOURCE_URL"
          else
            gh release download "$SRC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir .
            SRC=$(ls ./*.apk | head -1)
            cp "$SRC" app-src.apk
          fi
          ls -l app-src.apk
          echo "SRC=$PWD/app-src.apk" >> "$GITHUB_ENV"

      - name: Arac zinciri (apktool, zipalign, apksigner, keytool)
        run: |
          set -euo pipefail
          java -version || { echo "java yok"; exit 1; }
          URL=$(curl -sSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('apktool_') and a['name'].endswith('.jar')][0])")
          echo "apktool: $URL"
          curl -sSL -o apktool.jar "$URL"
          echo "APKTOOL=$PWD/apktool.jar" >> "$GITHUB_ENV"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "zipalign: $BT/zipalign"
          echo "apksigner: $BT/apksigner"
          "$BT/zipalign" 2>&1 | head -2 || true

      - name: Imza anahtari
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore wear.jks -alias wear -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Wear APK, OU=Saat, O=Yerel, L=Istanbul, C=TR" 2>&1 | tail -3
          echo "KS=$PWD/wear.jks" >> "$GITHUB_ENV"

      - name: Varyant A - yalnizca arm64-v8a cikar
        run: |
          set -euo pipefail
          cd work
          cp app-src.apk v7a-unsigned.apk
          zip -d v7a-unsigned.apk 'lib/arm64-v8a/*' >/dev/null
          echo "-- kalan ABI klasorleri --"
          unzip -l v7a-unsigned.apk | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort | uniq -c
          "$BT/zipalign" -f -p 4 v7a-unsigned.apk v7a-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out Subway+Surfers_3.70.3_wear-v7a.apk v7a-aligned.apk
          "$BT/apksigner" verify --verbose Subway+Surfers_3.70.3_wear-v7a.apk | head -8
          ls -l Subway+Surfers_3.70.3_wear-v7a.apk

      - name: Varyant B - manifest + theme duzeltmeleri
        id: variantb
        continue-on-error: true
        run: |
          set -uo pipefail
          cd work
          LOG=../reports/wear-build-log.txt
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          set -x
          java -jar "$APKTOOL" d -s -f app-src.apk -o dec
          DEC_RC=$?
          set +x
          if [ $DEC_RC -ne 0 ]; then
            echo "APKTOOL DECODE BASARISIZ (rc=$DEC_RC)"
            exit 1
          fi
          rm -rf dec/lib/arm64-v8a

          echo "-- application android:theme --"
          grep -o 'android:theme="[^"]*"' dec/AndroidManifest.xml | head -3 || true

          python3 - <<'PY'
          import re, pathlib, sys

          mpath = pathlib.Path("dec/AndroidManifest.xml")
          s = mpath.read_text(encoding="utf-8")

          if 'android:largeHeap' not in s:
              s = s.replace('<application', '<application android:largeHeap="true"', 1)
          if 'android.hardware.type.watch' not in s:
              s = s.replace('<application',
                  '<uses-feature android:name="android.hardware.type.watch" android:required="false" />\n    <application', 1)
          # Tum activity'lere configChanges ekle: Wear OS'ta pencere boyutu/yogunluk
          # degisince activity yeniden olusturulur ve Unity tarafinda cokme yasanir.
          wanted = ["orientation", "screenSize", "smallestScreenSize", "screenLayout",
                    "density", "uiMode", "keyboardHidden", "navigation", "fontScale",
                    "locale", "layoutDirection"]

          def patch_activity(mo):
              tag = mo.group(0)
              existing = re.search(r'android:configChanges="([^"]*)"', tag)
              if existing:
                  vals = [v for v in existing.group(1).split("|") if v]
                  merged = sorted(set(vals) | set(wanted))
                  return tag[:existing.start(1)] + "|".join(merged) + tag[existing.end(1):]
              attr = ' android:configChanges="' + "|".join(wanted) + '"'
              if tag.rstrip().endswith("/>"):
                  return tag.rstrip()[:-2] + attr + " />"
              return tag.rstrip()[:-1] + attr + ">"

          s2, n = re.subn(r"<activity\b[^>]*>", patch_activity, s)
          s = s2
          print("configChanges eklenen activity sayisi:", n)

          mpath.write_text(s, encoding="utf-8")
          print("manifest guncellendi")

          # Uygulamanin temasini bul
          app_theme = None
          m = re.search(r'<application[^>]*android:theme="@style/([^"]+)"', s)
          if m:
              app_theme = m.group(1)
          print("application theme:", app_theme)

          ITEM = '<item name="android:windowSwipeToDismiss">false</item>'

          def patch_style(text, name):
              # yalnizca verilen isimdeki, kendini kapatmayan <style ...> blogu
              pat = re.compile(r'(<style\s+[^>]*name="' + re.escape(name) + r'"[^>]*(?<!/)>)')
              return pat.sub(lambda mo: mo.group(1) + "\n        " + ITEM, text, count=1), len(pat.findall(text))

          changed = []
          if app_theme:
              for f in pathlib.Path("dec/res").rglob("*.xml"):
                  try:
                      t = f.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  if ITEM in t or app_theme not in t:
                      continue
                  new, _ = patch_style(t, app_theme)
                  if new != t:
                      f.write_text(new, encoding="utf-8")
                      changed.append(str(f))
                      print("tema yamalandi:", f)

          if not changed:
              # geri donus: values/styles.xml icindeki kendini kapatmayan tum style bloklari
              for f in list(pathlib.Path("dec/res/values").glob("styles*.xml")):
                  t = f.read_text(encoding="utf-8")
                  if ITEM in t:
                      continue
                  new = re.sub(r'(<style\s+[^>]*(?<!/)>)', lambda mo: mo.group(1) + "\n        " + ITEM, t)
                  if new != t:
                      f.write_text(new, encoding="utf-8")
                      changed.append(str(f))
                      print("yedek plan uygulandi:", f)

          print("degisen dosya sayisi:", len(changed))
          if not changed:
              print("UYARI: tema bulunamadi, windowSwipeToDismiss eklenemedi")
          PY

          echo "-- yeniden paketle --"
          java -jar "$APKTOOL" b dec -o ready-unsigned.apk
          BRC=$?
          if [ $BRC -ne 0 ]; then
            echo "build rc=$BRC, --use-aapt2 ile tekrar"
            java -jar "$APKTOOL" b dec -o ready-unsigned.apk --use-aapt2
            BRC=$?
          fi
          [ $BRC -eq 0 ] || { echo "APKTOOL BUILD BASARISIZ"; exit 1; }
          ls -l ready-unsigned.apk

          "$BT/zipalign" -f -p 4 ready-unsigned.apk ready-aligned.apk || exit 1
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out Subway+Surfers_3.70.3_wear-ready.apk ready-aligned.apk || exit 1
          "$BT/apksigner" verify --verbose Subway+Surfers_3.70.3_wear-ready.apk | head -8
          echo "VARYANT B TAMAM"

      - name: Uretilenleri dogrula
        run: |
          set -euo pipefail
          cd work
          mkdir -p ../reports
          R=../reports/wear-build.md
          {
            echo "# Wear varyantlari"
            echo
            echo "- Kaynak: $SRC_TAG / Subway+Surfers_3.70.3_APKPure.apk"
            echo "- Imza: yerel test anahtari (Play/Play Games imzasi degil)"
            echo
          } > "$R"
          for f in Subway+Surfers_3.70.3_wear-v7a.apk Subway+Surfers_3.70.3_wear-ready.apk; do
            [ -f "$f" ] || { echo "## $f — URETILEMEDI" >> "$R"; echo >> "$R"; continue; }
            {
              echo "## $f"
              echo '```'
              echo "boyut: $(stat -c %s "$f") bayt"
              echo "sha256: $(sha256sum "$f" | cut -d' ' -f1)"
              unzip -l "$f" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort | uniq -c
              "$BT/apksigner" verify --print-certs "$f" 2>/dev/null | head -3 || true
              "$BT/aapt2" dump badging "$f" 2>/dev/null | grep -E "package:|sdkVersion|targetSdkVersion|native-code|uses-feature" | head -12 || true
              echo '```'
              echo
            } >> "$R"
          done
          cat "$R"

      - name: Release'e yukle
        run: |
          set -euo pipefail
          cd work
          NOTES="$RUNNER_TEMP/wear-notes.md"
          {
            echo "Galaxy Watch 8 / Wear OS icin hazirlanmis varyantlar."
            echo
            echo '- `wear-v7a`: yalnizca armeabi-v7a kutuphaneleri, yeniden imzali (~160 MB)'
            echo '- `wear-ready`: wear-v7a + windowSwipeToDismiss=false + largeHeap + watch feature'
            echo
            echo 'Kurulum: once `adb uninstall com.kiloo.subwaysurf` (imza farkli), sonra:'
            echo
            echo '    adb install -r --abi armeabi-v7a <dosya>.apk'
          } > "$NOTES"
          if ! gh release view "$OUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$OUT_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Subway Surfers 3.70.3 - Wear OS (32-bit) varyantlari" \
              --notes-file "$NOTES"
          fi
          gh release upload "$OUT_TAG" ./*_wear-v7a.apk --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null || true
          gh release upload "$OUT_TAG" ./*_wear-ready.apk --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null || true
          gh release view "$OUT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Raporu commit et
        if: always()
        run: |
          set -euo pipefail
          git config user.name "wear-build-bot"
          git config user.email "wear-build-bot@users.noreply.github.com"
          git add reports 2>/dev/null || true
          git diff --cached --quiet && { echo "Degisiklik yok"; exit 0; }
          git commit -m "Wear varyant build raporu"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
