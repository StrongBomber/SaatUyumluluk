name: APK denetimi (ABI + native uyumluluk)

# Release'teki APK'nın CPU mimarileri, yerel kütüphane eşliği, sıkıştırma
# yöntemi, sayfa hizası ve tam manifest bilgisini raporlar.
# Sonuçlar reports/ altına yazılıp depoya commit edilir.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi"
        required: false
        default: "apk-v3.70.3"
  push:
    paths:
      - ".github/apk-inspect-trigger"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || 'apk-v3.70.3' }}

    steps:
      - uses: actions/checkout@v4

      - name: APK'yi release'ten indir
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir .
          ls -l ./*.apk

      - name: Temel rapor
        run: |
          set -euo pipefail
          APK=$(ls ./*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          mkdir -p reports
          R=reports/apk-inspect.md
          {
            echo "# APK denetim raporu"
            echo ""
            echo "- APK: \`$(basename "$APK")\`"
            echo "- Boyut: $(stat -c %s "$APK") bayt"
            echo "- Calistirilan etiket: $TAG"
            echo
            echo "## lib/ altindaki ABI klasorleri"
            echo '```'
            unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort | uniq -c
            echo '```'
            echo
            echo "## ABI basina toplam boyut"
            echo '```'
            for abi in $(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u); do
              BYTES=$(unzip -l "$APK" | awk -v a="lib/$abi/" '$4 ~ "^"a {s+=$1} END {print s+0}')
              echo "$abi: $BYTES bayt ($(( BYTES / 1024 / 1024 )) MiB)"
            done
            echo '```'
            echo
            echo "## Iki ABI arasinda kutuphane esligi (parity)"
            echo '```'
            unzip -l "$APK" | awk '{print $4}' | grep '^lib/arm64-v8a/.*\.so$' | sed 's|lib/arm64-v8a/||' | sort > /tmp/a64.txt
            unzip -l "$APK" | awk '{print $4}' | grep '^lib/armeabi-v7a/.*\.so$' | sed 's|lib/armeabi-v7a/||' | sort > /tmp/a32.txt
            echo "arm64-v8a: $(wc -l < /tmp/a64.txt) dosya, armeabi-v7a: $(wc -l < /tmp/a32.txt) dosya"
            echo "--- yalnizca 64-bit ---"; comm -23 /tmp/a64.txt /tmp/a32.txt
            echo "--- yalnizca 32-bit ---"; comm -13 /tmp/a64.txt /tmp/a32.txt
            echo '```'
            echo
            echo "## Yerel kutuphanelerin APK icinde saklanma bicimi"
            echo '```'
            unzip -v "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a)/(libil2cpp|libunity|libc\+\+_shared)\.so" | head -10
            echo '```'
            echo
            echo "## ELF sayfa hizasi (16 KB sayfa destegi icin kritik)"
            echo '```'
            for abi in arm64-v8a armeabi-v7a; do
              for lib in libil2cpp.so libunity.so; do
                unzip -o -q "$APK" "lib/$abi/$lib" -d /tmp/ex || continue
                echo "-- $abi/$lib"
                readelf -lW "/tmp/ex/lib/$abi/$lib" 2>/dev/null | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' '
                echo
              done
            done
            echo '```'
            echo
            echo "## aapt badging"
            echo '```'
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "package:|sdkVersion|targetSdkVersion|native-code|uses-feature|densities|launchable-activity" | head -40 || true
            echo '```'
          } > "$R"
          cat "$R"

      - name: Tam manifest dokumu
        run: |
          set -euo pipefail
          APK=$(ls ./*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > reports/apk-manifest.txt 2>&1 || true
          wc -l reports/apk-manifest.txt

      - name: Ilk 200 satirlik manifest ozeti
        run: |
          set -euo pipefail
          {
            echo
            echo "## Manifest ozeti (ilk bolum)"
            echo '```'
            head -120 reports/apk-manifest.txt
            echo '```'
            echo
            echo "## Manifestte dikkat ceken anahtarlar"
            echo '```'
            grep -iE "extractNativeLibs|usesCleartextTraffic|debuggable|type.watch|hardware.type|largeHeap|resizeableActivity|isolatedSplits|hasCode|multiArch|permission name|uses-sdk|minSdk|targetSdk" reports/apk-manifest.txt | head -60
            echo '```'
          } >> reports/apk-inspect.md
          tail -70 reports/apk-inspect.md

      - name: Raporu commit et
        run: |
          set -euo pipefail
          git config user.name "apk-inspect-bot"
          git config user.email "apk-inspect-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && { echo "Degisiklik yok"; exit 0; }
          git commit -m "APK denetim raporu ($TAG)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
