name: APK ABI denetimi

# Release'teki APK'nın hangi CPU mimarileri için yerel kütüphane içerdiğini,
# min/target SDK ve manifest özelliklerini raporlar (Wear OS uyumu için).
# Sonuç reports/apk-inspect.md dosyasına yazılıp depoya commit edilir.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi"
        required: false
        default: "apk-v3.70.3"
  push:
    paths:
      - ".github/apk-inspect-trigger"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || 'apk-v3.70.3' }}

    steps:
      - uses: actions/checkout@v4

      - name: APK'yi release'ten indir
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir .
          ls -l ./*.apk

      - name: Raporu olustur
        run: |
          set -euo pipefail
          APK=$(ls ./*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          mkdir -p reports
          R=reports/apk-inspect.md
          {
            echo "# APK denetim raporu"
            echo ""
            echo "- APK: \`$(basename "$APK")\`"
            echo "- Boyut: $(stat -c %s "$APK") bayt"
            echo "- Calistirilan etiket: $TAG"
            echo
            echo "## lib/ altindaki ABI klasorleri"
            echo '```'
            unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort | uniq -c
            echo '```'
            echo
            echo "## ABI basina toplam boyut"
            echo '```'
            for abi in $(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u); do
              BYTES=$(unzip -l "$APK" | awk -v a="lib/$abi/" '$4 ~ "^"a {s+=$1} END {print s+0}')
              echo "$abi: $BYTES bayt ($(( BYTES / 1024 / 1024 )) MiB)"
            done
            echo '```'
            echo
            echo "## En buyuk .so dosyalari"
            echo '```'
            unzip -l "$APK" | grep '\.so$' | sort -k1 -n -r | head -15
            echo '```'
            echo
            echo "## aapt badging"
            echo '```'
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "package:|sdkVersion|targetSdkVersion|native-code|uses-feature|densities|launchable-activity" | head -40 || true
            echo '```'
            echo
            echo "## Manifest: GL / donanim gereksinimleri"
            echo '```'
            "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null | grep -iE "glEsVersion|touchscreen|watch|uses-feature|required" | head -40 || true
            echo '```'
          } > "$R"
          cat "$R"

      - name: Raporu commit et
        run: |
          set -euo pipefail
          git config user.name "apk-inspect-bot"
          git config user.email "apk-inspect-bot@users.noreply.github.com"
          git add reports/apk-inspect.md
          git diff --cached --quiet && { echo "Degisiklik yok"; exit 0; }
          git commit -m "APK denetim raporu ($TAG)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
