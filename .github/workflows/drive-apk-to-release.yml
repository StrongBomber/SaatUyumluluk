name: Drive'dan APK al ve Release'e yükle

# Amaç: Google Drive'daki büyük APK'yı (git push tek dosyada 100 MB ile sınırlı
# olduğu için) GitHub Actions runner üzerinden indirip Release asset'i yapmak.

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive dosya kimliği"
        required: false
        default: "1D1cF_iFldnM1tYCkH1LvlmcRjCQSa82A"
      tag:
        description: "Release etiketi"
        required: false
        default: "apk-v3.70.3"
      asset_name:
        description: "Asset dosya adı"
        required: false
        default: "Subway+Surfers_3.70.3_APKPure.apk"
  push:
    paths:
      - ".github/apk-import-trigger"

permissions:
  contents: write

concurrency:
  group: apk-import
  cancel-in-progress: false

jobs:
  import-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FILE_ID: ${{ inputs.file_id || '1D1cF_iFldnM1tYCkH1LvlmcRjCQSa82A' }}
      TAG: ${{ inputs.tag || 'apk-v3.70.3' }}
      ASSET_NAME: ${{ inputs.asset_name || 'Subway+Surfers_3.70.3_APKPure.apk' }}
      EXPECTED_SIZE: "269958630"

    steps:
      - name: Ortam bilgisi
        run: |
          echo "Dosya kimligi : $FILE_ID"
          echo "Release etiketi: $TAG"
          echo "Asset adi      : $ASSET_NAME"
          df -h / | tail -1

      - name: gdown kur
        run: python3 -m pip install --quiet --upgrade gdown

      - name: Drive'dan indir (gdown)
        id: dl
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "Deneme $i/3 (gdown)"
            if gdown --no-cookies --id "$FILE_ID" -O "$ASSET_NAME"; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Drive'dan indir (curl yedek yol)
        if: steps.dl.outputs.ok != 'true'
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$ASSET_NAME" "$URL"

      - name: Dogrula
        run: |
          set -euo pipefail
          SIZE=$(stat -c %s "$ASSET_NAME")
          SHA=$(sha256sum "$ASSET_NAME" | cut -d' ' -f1)
          echo "Boyut : $SIZE bayt (beklenen $EXPECTED_SIZE)"
          echo "SHA256: $SHA"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          file "$ASSET_NAME" || true
          test "$SIZE" -gt 100000000 || { echo "HATA: dosya cok kucuk, indirme basarisiz olabilir"; exit 1; }
          {
            echo "### APK ice aktarma"
            echo ""
            echo "| Alan | Deger |"
            echo "| --- | --- |"
            echo "| Dosya | $ASSET_NAME |"
            echo "| Boyut | $SIZE bayt |"
            echo "| SHA256 | $SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release notlarini hazirla
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            echo "APK ikili dosyasi. Git deposuna commit edilmez; git push tek dosyada 100 MB ile sinirli oldugu icin release asset olarak yayinlanir."
            echo ""
            echo "- Dosya: \`$ASSET_NAME\`"
            echo "- Boyut: $(stat -c %s "$ASSET_NAME") bayt"
            echo "- SHA256: \`$SHA\`"
            echo "- Kaynak: Google Drive dosya kimligi \`$FILE_ID\`"
          } > "$NOTES_FILE"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Release olustur
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Subway Surfers 3.70.3 (APKPure) APK" \
              --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"
          fi

      - name: Asset'i yukle
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Ozet
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '.url, (.assets[] | "\(.name)  \(.size) bayt")'
